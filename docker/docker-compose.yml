# full wipe:
#   docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: moneyscope-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password_placeholder}
      - POSTGRES_DB=${POSTGRES_DB:-moneyscope}
    env_file:
      - postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
