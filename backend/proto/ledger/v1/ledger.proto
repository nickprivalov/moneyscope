syntax = "proto3";

package ledger.v1;

import "google/protobuf/timestamp.proto";
import "common/v1/money.proto";

option go_package = "github.com/nickprivalov/moneyscope/backend/gen/go/ledger/v1;ledgerv1";

// Describes the type of `Transaction`
enum TransactionType {
  // Uncategorized
  UNSPECIFIED = 0;
  // Credit/Positive transaction
  INCOME = 1;
  // Debit/Negative transaction
  EXPENSE = 2;
  // Transfer of funds
  TRANSFER = 3;
}

message Transaction {
  // Transaction unique ID
  string id = 1;
  // User ID for transaction
  string user_id = 2;
  // Account ID for transaction
  string account_id = 3;
  // Timestamp of transaction
  google.protobuf.Timestamp date = 4;
  // Monetary value of transaction
  common.v1.Money amount = 5;
  // Description of transaction
  string description = 6;
  // Category ID?
  string category_id = 7;
  // Categorized TransactionType
  TransactionType type = 8;
  // Descriptor tags of `Transaction`
  repeated string tags = 9;
  // Timestamp of `Transaction` object creation
  google.protobuf.Timestamp created_at = 10;
  // Timestamp of `Transaction` object last-updated
  google.protobuf.Timestamp updated_at = 11;
}

// --- Service Definition ---

service LedgerService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse);
  rpc CreateTransactionsBatch(CreateTransactionsBatchRequest) returns (CreateTransactionsBatchResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse);
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse);
}

// --- Request/Response DTOs ---

message CreateTransactionRequest {
  string user_id = 1;
  string account_id = 2;
  google.protobuf.Timestamp date = 3;
  common.v1.Money amount = 4;
  string description = 5;
  string category_id = 6;
  TransactionType type = 7;
}

message CreateTransactionResponse {
  Transaction transaction = 1;
}

message CreateTransactionsBatchRequest {
  repeated CreateTransactionRequest transactions = 1;
}

message CreateTransactionsBatchResponse {
  int32 succeeded_count = 1;
  int32 failed_count = 2;
  repeated string failed_indices = 3;
}

message GetTransactionRequest {
  string id = 1;
  string user_id = 2;
}

message GetTransactionResponse {
  Transaction transaction = 1;
}

message ListTransactionsRequest {
  string user_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
}

message UpdateTransactionRequest {
  Transaction transaction = 1;
}

message UpdateTransactionResponse {
  Transaction transaction = 1;
}

message DeleteTransactionRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteTransactionResponse {
  bool success = 1;
}
