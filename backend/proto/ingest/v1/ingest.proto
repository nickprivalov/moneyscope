syntax = "proto3";

package ingest.v1;

option go_package = "github.com/nickprivalov/moneyscope/backend/gen/go/ingest/v1;ingestv1";

service IngestService {
  // UploadStatement accepts a stream of file chunks.
  // The first message must contain metadata.
  // Subsequent messages must contain file content.
  rpc UploadStatement(stream UploadStatementRequest) returns (UploadStatementResponse);
}

message UploadStatementRequest {
  oneof payload {
    UploadMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadMetadata {
  string user_id = 1;
  string account_id = 2;
  string file_name = 3;
  // Could add bank_format (e.g., "CHASE", "BOA") here?
}

message UploadStatementResponse {
  int32 status_code = 1;
  int32 transactions_processed = 2;
  int32 transactions_failed = 3;
  string message = 4;
}
